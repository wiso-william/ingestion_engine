[project]
name = "ingestion-engine"
version = "0.1.0"
description = "Extensible ETL framework that extracts records from SQL and REST sources, normalizes them, and loads them into analytical databases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "clickhouse-connect>=1.5.0",
    "mariadb>=1.1.14",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # outdated syntax
    "B",    # likely bugs
    "C4",   # comprehensions
    "SIM",  # needless complexity
    "PT",   # pytest style
    "ANN",  # missing annotations
    "RUF",  # ruff specific
]

[tool.ruff.lint.per-file-ignores]
# Test functions are named, not annotated: their signature is fixtures only.
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
