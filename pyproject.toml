[project]
name = "ingestion-engine"
version = "0.1.0"
description = "Extensible ETL framework that extracts records from SQL and REST sources, normalizes them, and loads them into analytical databases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "clickhouse-connect>=1.5.0",
    "mariadb>=1.1.14",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
