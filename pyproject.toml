[project]
name = "ingestion-engine"
version = "0.1.0"
description = "Extensible ETL framework that extracts records from SQL and REST sources, normalizes them, and loads them into analytical databases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "clickhouse-connect>=1.5.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

# The mariadb driver publishes wheels for Windows only, so everywhere else it
# is built from source against MariaDB Connector/C. It is optional so that the
# rest of the package installs without that system library.
[project.optional-dependencies]
mariadb = [
    "mariadb>=1.1.14",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.mypy]
strict = true
files = ["src", "examples", "tests"]
mypy_path = "src"
explicit_package_bases = true

# The mariadb driver ships neither annotations nor a py.typed marker, so its
# module is opaque to the checker. Everything the project does with it stays
# checked; only the driver's own signatures are unknown.
[[tool.mypy.overrides]]
module = ["mariadb"]
ignore_missing_imports = true

# Test functions are identified by their name, not their signature, so they are
# exempt from the annotation requirement. This mirrors the ruff per-file-ignore.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # outdated syntax
    "B",    # likely bugs
    "C4",   # comprehensions
    "SIM",  # needless complexity
    "PT",   # pytest style
    "ANN",  # missing annotations
    "RUF",  # ruff specific
]

[tool.ruff.lint.per-file-ignores]
# Test functions are named, not annotated: their signature is fixtures only.
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
